{% extends 'base.html' %}
{% block title %}WODASHTECH | Create Account{% endblock %}
{% block content %}
<div class="auth-shell"><a class="back-button" href="{{ url_for('login') }}">← <span>Back</span></a><section class="auth auth-card compact-card"><div class="brand">WODASHTECH</div><p class="brand-sub">TECHNOLOGY. INNOVATION. IMPACT.</p><h1>Create Account</h1><p class="auth-subtitle">Join WODASHTECH and start exploring.</p><form method="post"><label>First Name</label><input name="first_name" required><label>Last Name</label><input name="last_name" required><label>Birthday</label><input name="birthday" type="date" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="8" required><label>Confirm Password</label><input name="confirm" type="password" minlength="8" required><button class="primary-login">Create Account</button></form><p class="center-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></section></div>
{% endblock %}
