{% extends 'base.html' %}

{% block title %}WODASHTECH | Login{% endblock %}

{% block content %}
<section class="auth">
    <div class="brand">WODASHTECH</div>
    <p class="tagline">Technological Solutions</p>

    <h2>MATHS</h2>

    <form method="post">
        <label>Mobile number or email</label>
        <input name="email" type="email"
               placeholder="e@gmail.com" required>

        <label>Password</label>
        <input name="password" type="password" required>

        <label class="check">
            <input type="checkbox" name="remember">
            Remember me
        </label>

        <button>Login</button>
    </form>

    <a href="{{ url_for('reset') }}">Forgot Password?</a>
    <a class="strong" href="{{ url_for('signup') }}">
        Create new account
    </a>

    <hr>

    <p class="muted">This app was targeted by SWEtech8</p>

    <div class="tags">
        {% for t in tags %}
        <span>{{ t }}</span>
        {% endfor %}
    </div>
</section>
{% endblock %}
